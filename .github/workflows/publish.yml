# Tells GitHub to run brief.py on a schedule and publish the result.
#
# This file must live at exactly .github/workflows/ - GitHub only looks there.
# The format is YAML, where indentation carries meaning: the number of spaces at
# the start of a line decides what belongs to what. Use spaces, never tabs.
#
# HOW PUBLISHING WORKS HERE
# The rebuilt page is handed straight to GitHub Pages as a parcel and never
# committed back into the repository. That matters: if the robot committed the
# page every morning, your laptop's copy would fall behind overnight and every
# push from your machine would be rejected until you pulled first. Because
# nothing is written back, the repository only ever contains what you wrote, and
# your laptop can never fall behind.

name: Publish market brief

# "on" means: when should this run?
on:
  schedule:
    # Cron format: minute hour day-of-month month day-of-week
    #              0      */3  *            *     *
    # so: on the hour, every third hour, every day.
    #
    # GitHub reads these times as UTC and offers no timezone setting. Istanbul is
    # UTC+3 all year - Turkey stopped changing its clocks in 2016 - so 03:00 UTC
    # is 06:00 in Istanbul, in summer and winter alike. Somewhere with daylight
    # saving would drift by an hour twice a year and need this line edited.
    #
    # 03:00 UTC is in this set, so the morning brief still lands when you wake
    # up. The other runs exist because editing a Google Sheet cannot notify
    # GitHub - a schedule is the only way a changed holding gets noticed - and
    # waiting until tomorrow to see it would be too slow. It runs at weekends
    # too, because crypto trades then. Public repositories get unlimited free
    # minutes and each run takes about half a minute.
    - cron: "0 */3 * * *"

  # Rebuild whenever the holdings or the calendar are edited on GitHub, so a
  # change to positions.json shows up on the dashboard about a minute later
  # rather than waiting until the next morning.
  push:
    branches: [main]
    paths:
      - "positions.json"
      - "calendar.json"
      - "brief.py"

  # Adds a "Run workflow" button on the Actions tab, so you can trigger a run
  # yourself instead of waiting until tomorrow morning.
  workflow_dispatch:

# What this job is allowed to do. It only needs to READ the repository now,
# because it no longer writes anything back. The other two permissions let it
# hand the finished page to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If a scheduled run and a manual run overlap, let them queue rather than fight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # A fresh, empty Linux machine, created for this run and destroyed after.
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get the repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip          # remembers downloaded packages, so later runs are quicker

      - name: Install the packages
        run: pip install -r requirements.txt

      # If brief.py fails - for instance every price download returns nothing -
      # it exits with an error, this step goes red, and the steps below never
      # run. The previously published page stays up rather than being replaced
      # by a broken one.
      - name: Build the page
        run: python brief.py

      - name: Prepare Pages
        uses: actions/configure-pages@v6

      # Wraps the docs folder into a parcel for Pages to collect.
      - name: Parcel up the page
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Publish to the website
        id: deployment
        uses: actions/deploy-pages@v5
